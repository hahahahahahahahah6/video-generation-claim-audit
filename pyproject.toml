[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video-generation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented prompt conditioned clip synthesis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "video-generation-claim-audit contributors"}]

[project.scripts]
video-generation-claim-audit = "video_generation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["video_generation_claim_audit*"]
